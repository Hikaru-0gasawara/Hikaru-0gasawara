<svg xmlns="http://www.w3.org/2000/svg" width="505" height="258" viewBox="0 0 505 258" role="img" aria-labelledby="title"><title id="title">Infrastructure lab — infra · security</title><desc>A small company built from scratch: AD/DC identity, segmented network, IPFire perimeter firewall and a SIEM correlating events, all virtualized on Proxmox. Kali Linux checks that the rules hold.</desc><style>@font-face{font-family:'JBM';font-weight:400 800;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'JBM','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;fill:#E8E4D4;white-space:pre}.jp{font-family:'DG','DotGothic16','Hiragino Sans','Yu Gothic','Noto Sans CJK JP',sans-serif}.tx{fill:#E8E4D4}.mut{fill:#A3AD9F}.dim{fill:#7F8A7C}.faint{fill:#4A564C}.gold{fill:#D8B24A}.gold2{fill:#F0CE6A}.jade{fill:#62B37F}.jade2{fill:#8FD3A6}.sky{fill:#7FB2DA}.red{fill:#E07A6E}.b{font-weight:700}.lab{font-size:10.5px;letter-spacing:1.9px}.chip{fill:#C9CBBE}.ft{font-size:12px}.ds{font-size:13.5px}.gl{animation:gl 5s ease-in-out infinite}@keyframes gl{0%,100%{opacity:.35}50%{opacity:.9}}</style><rect x="0" y="0" width="495" height="258" fill="#0A0F0B"/><rect x="0.5" y="0.5" width="494" height="257" fill="#0D130F" stroke="rgba(232,228,212,.2)"/><path d="M1 34.5H494" stroke="rgba(232,228,212,.11)"/><text x="14" y="21" class="lab dim">01 · INFRA · SECURITY</text><text x="481" y="21" class="lab gold" text-anchor="end">ACADEMIC</text><rect x="16.5" y="50.5" width="43" height="43" fill="#131B15" stroke="rgba(216,178,74,.42)"/><g transform="translate(25 59) scale(1.08333)"><path d="M3 5h18v14H3zM3 9.7h18M3 14.3h18M9 5v4.7M15 5v4.7M6 9.7v4.6M12 9.7v4.6M18 9.7v4.6M9 14.3V19M15 14.3V19" fill="none" stroke="#E07A6E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="74" y="70" class="tx b" font-size="22">Infrastructure lab</text><text x="74" y="90" class="dim" font-size="11.5">academic project</text><text x="16" y="124" class="ds mut">A small company built from scratch: AD/DC identity,</text><text x="16" y="144" class="ds mut">segmented network, IPFire perimeter firewall and a SIEM</text><text x="16" y="164" class="ds mut">correlating events, all virtualized on Proxmox. Kali</text><text x="16" y="184" class="ds mut">Linux checks that the rules hold.</text><rect x="16.5" y="198.5" width="61.2" height="22" fill="rgba(232,228,212,.03)" stroke="rgba(232,228,212,.2)"/><text x="24" y="213.5" class="chip" font-size="11">Proxmox</text><rect x="84.7" y="198.5" width="107.4" height="22" fill="rgba(232,228,212,.03)" stroke="rgba(232,228,212,.2)"/><text x="92.2" y="213.5" class="chip" font-size="11">Windows Server</text><rect x="199.1" y="198.5" width="48" height="22" fill="rgba(232,228,212,.03)" stroke="rgba(232,228,212,.2)"/><text x="206.6" y="213.5" class="chip" font-size="11">AD/DC</text><rect x="254.1" y="198.5" width="54.6" height="22" fill="rgba(232,228,212,.03)" stroke="rgba(232,228,212,.2)"/><text x="261.6" y="213.5" class="chip" font-size="11">IPFire</text><rect x="315.7" y="198.5" width="41.4" height="22" fill="rgba(232,228,212,.03)" stroke="rgba(232,228,212,.2)"/><text x="323.2" y="213.5" class="chip" font-size="11">SIEM</text><rect x="364.1" y="198.5" width="41.4" height="22" fill="rgba(232,228,212,.03)" stroke="rgba(232,228,212,.2)"/><text x="371.6" y="213.5" class="chip" font-size="11">Kali</text><path d="M1 222.5H494" stroke="rgba(232,228,212,.11)"/><text x="16" y="244" class="ft dim">no public repository</text><text x="479" y="244" class="ft gold2" text-anchor="end">see portfolio →</text></svg>
