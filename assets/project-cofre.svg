<svg xmlns="http://www.w3.org/2000/svg" width="505" height="258" viewBox="0 0 505 258" role="img" aria-labelledby="title"><title id="title">Electronic safe — embedded · c++</title><desc>One safe ported to Arduino UNO, Raspberry Pi Pico (MicroPython) and ESP32: I²C LCD, 3×4 keypad, servo and the password kept in NVS. The LCD was even driven by bit-banging.</desc><style>@font-face{font-family:'JBM';font-weight:400 800;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:'JBM','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;fill:#E8E4D4;white-space:pre}.jp{font-family:'DG','DotGothic16','Hiragino Sans','Yu Gothic','Noto Sans CJK JP',sans-serif}.tx{fill:#E8E4D4}.mut{fill:#A3AD9F}.dim{fill:#7F8A7C}.faint{fill:#4A564C}.gold{fill:#D8B24A}.gold2{fill:#F0CE6A}.jade{fill:#62B37F}.jade2{fill:#8FD3A6}.sky{fill:#7FB2DA}.red{fill:#E07A6E}.b{font-weight:700}.lab{font-size:10.5px;letter-spacing:1.9px}.chip{fill:#C9CBBE}.ft{font-size:12px}.ds{font-size:13.5px}.gl{animation:gl 5s ease-in-out infinite}@keyframes gl{0%,100%{opacity:.35}50%{opacity:.9}}</style><rect x="0" y="0" width="495" height="258" fill="#0A0F0B"/><rect x="0.5" y="0.5" width="494" height="257" fill="#0D130F" stroke="rgba(232,228,212,.2)"/><path d="M1 34.5H494" stroke="rgba(232,228,212,.11)"/><text x="14" y="21" class="lab dim">03 · EMBEDDED · C++</text><text x="481" y="21" class="lab gold" text-anchor="end">PERSONAL</text><rect x="16.5" y="50.5" width="43" height="43" fill="#131B15" stroke="rgba(216,178,74,.42)"/><g transform="translate(25 59) scale(1.08333)"><path d="M7 7h10v10H7zM10 10h4v4h-4zM9.5 3.5V7M14.5 3.5V7M9.5 17v3.5M14.5 17v3.5M3.5 9.5H7M3.5 14.5H7M17 9.5h3.5M17 14.5h3.5" fill="none" stroke="#F0CE6A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="74" y="70" class="tx b" font-size="22">Electronic safe</text><text x="74" y="90" class="dim" font-size="11.5">Hikaru-0gasawara/IoT-SafeSistem</text><text x="16" y="124" class="