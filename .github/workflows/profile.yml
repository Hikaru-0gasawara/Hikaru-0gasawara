name: render profile

on:
  schedule:
    - cron: "17 9 * * *"        # todo dia, 06:17 em São Paulo
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["gen/**", ".github/workflows/profile.yml"]

permissions:
  contents: write

concurrency:
  group: render-profile
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#F0CE6A&color_dots=#131B15,#1F3B28,#2E6B44,#62B37F,#8FD3A6

      - name: Render panels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m gen

      - name: Commit refreshed assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet && echo "nothing changed" && exit 0
          git commit -m "render: refresh panels $(date -u +%Y-%m-%d)"
          git pull --rebase -X theirs origin main
          git push
